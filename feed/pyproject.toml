[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thing-feed"
version = "0.1.0"
description = "Batch feed generation job for Thing."
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2.9,<4",
    "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5,<9",
]

[tool.pytest.ini_options]
pythonpath = [
    "src",
]
testpaths = [
    "tests",
]
